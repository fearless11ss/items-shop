name: Bug report
description: Report a reproducible problem with Items Shop
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Items Shop. Search existing issues before submitting a new report.

  - type: input
    id: mod-version
    attributes:
      label: Items Shop version
      placeholder: "1.6.6"
    validations:
      required: true

  - type: input
    id: forge-version
    attributes:
      label: Forge version
      placeholder: "47.4.10"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Single-player
        - Multiplayer client
        - Dedicated server
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and how it affected the game.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the shop...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Drag files here or paste a link. Remove tokens, addresses, and private information first.
      render: text

  - type: textarea
    id: mods
    attributes:
      label: Other installed mods
      description: List other mods or attach a mod list. Write "None" if Items Shop is the only mod.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using Minecraft 1.20.1 with Forge.
          required: true
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private information from attached logs.
          required: true
